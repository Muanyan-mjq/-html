<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>3D 爱心 · I LOVE YOU</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; touch-action: none; }
  body {
    background:
      radial-gradient(1100px 750px at 50% 44%, rgba(255, 45, 100, 0.12), transparent 62%),
      radial-gradient(850px 620px at 12% 88%, rgba(120, 30, 190, 0.16), transparent 60%),
      radial-gradient(850px 620px at 88% 12%, rgba(30, 70, 190, 0.14), transparent 60%),
      #04040c;
  }
  body::after {
    content: ""; position: fixed; inset: 0; pointer-events: none;
    background: radial-gradient(120% 120% at 50% 50%, transparent 55%, rgba(0, 0, 0, 0.5) 100%);
  }
  canvas { position: fixed; inset: 0; display: block; }
  .title {
    position: fixed; left: 0; right: 0; bottom: 10vh; text-align: center;
    pointer-events: none; user-select: none;
    font-family: Georgia, "Times New Roman", "Songti SC", "STSong", serif;
    font-size: clamp(22px, 4.2vw, 46px);
    letter-spacing: 0.42em; text-indent: 0.42em; font-weight: 600;
    color: transparent;
    background: linear-gradient(90deg, #ffc2da 0%, #ff5f92 30%, #ff2e63 50%, #ff5f92 70%, #ffc2da 100%);
    background-size: 200% 100%;
    -webkit-background-clip: text; background-clip: text;
    opacity: 0;
    animation: fadein 2.6s ease 1s forwards,
               breathe 1.15s ease-in-out 3.6s infinite,
               shine 5s linear 1.5s infinite;
  }
  .sub {
    position: fixed; left: 0; right: 0; bottom: 5.4vh; text-align: center;
    pointer-events: none; user-select: none;
    font-family: Georgia, "Times New Roman", "Songti SC", "STSong", serif;
    font-size: clamp(12px, 1.5vw, 16px);
    letter-spacing: 0.3em; text-indent: 0.3em;
    color: rgba(255, 195, 220, 0.72);
    text-shadow: 0 0 14px rgba(255, 80, 140, 0.45);
    opacity: 0; animation: fadein 2.6s ease 2s forwards;
  }
  .to {
    position: fixed; left: 0; right: 0; bottom: 1.7vh; text-align: center;
    pointer-events: none; user-select: none;
    font-family: Georgia, "Times New Roman", "Songti SC", "STSong", serif;
    font-size: clamp(11px, 1.4vw, 15px);
    letter-spacing: 0.42em; text-indent: 0.42em;
    color: transparent;
    background: linear-gradient(92deg, rgba(255,255,255,0.95), rgba(255,168,203,0.9) 45%, rgba(255,255,255,0.95));
    -webkit-background-clip: text; background-clip: text;
    filter: drop-shadow(0 0 10px rgba(255,120,170,0.45));
    opacity: 0; animation: fadein 2.6s ease 2.6s forwards;
  }
  .to::before {
    content: ""; display: block; margin: 0 auto 10px;
    width: 64px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,160,200,0.7), transparent);
    text-indent: 0;
  }
  @keyframes fadein { to { opacity: 1; } }
  @keyframes shine { to { background-position: -200% center; } }
  @keyframes breathe {
    0%, 100% { transform: scale(1);    filter: drop-shadow(0 0 14px rgba(255, 60, 120, 0.55)); }
    10%      { transform: scale(1.05); filter: drop-shadow(0 0 30px rgba(255, 60, 120, 0.9)); }
    24%      { transform: scale(1.01); filter: drop-shadow(0 0 18px rgba(255, 60, 120, 0.65)); }
  }
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div class="title">I LOVE YOU</div>
<div class="sub">愿 每 一 次 心 跳 · 都 有 回 响</div>
<div class="to">TO Hikoy</div>
<script>
(() => {
  'use strict';
  const canvas = document.getElementById('scene');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = canvas.width = Math.round(window.innerWidth * DPR);
    H = canvas.height = Math.round(window.innerHeight * DPR);
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
  }
  window.addEventListener('resize', resize);
  resize();

  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const FOV = 3000;
  const DEPTH = 9.5;
  const ZN = 23;
  const T0 = performance.now();
  const INTRO_SPREAD = 2.4;
  const INTRO_DUR = 1.4;
  const INTRO_END = INTRO_SPREAD + INTRO_DUR;

  function heartCurve(t) {
    return [
      16 * Math.pow(Math.sin(t), 3),
      13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)
    ];
  }

  const POINTS = 9000;
  const pts = new Float32Array(POINTS * 3);
  const sct = new Float32Array(POINTS * 3);
  const birth = new Float32Array(POINTS);
  const hueIdx = new Uint8Array(POINTS);
  const sizeRand = new Float32Array(POINTS);
  const glitter = new Uint8Array(POINTS);

  for (let i = 0; i < POINTS; i++) {
    const t = Math.random() * Math.PI * 2;
    const c = heartCurve(t);
    const z = Math.random() * 2 - 1;
    let s = Math.pow(1 - z * z, 0.42);
    if (Math.random() < 0.4) s *= Math.pow(Math.random(), 1 / 3);
    const sc = s * (0.96 + Math.random() * 0.08);
    pts[i * 3] = c[0] * sc;
    pts[i * 3 + 1] = c[1] * sc;
    pts[i * 3 + 2] = z * DEPTH;

    const R = 26 + Math.random() * 36;
    const th = Math.random() * Math.PI * 2;
    const ph = Math.acos(Math.random() * 2 - 1);
    sct[i * 3] = R * Math.sin(ph) * Math.cos(th);
    sct[i * 3 + 1] = R * Math.sin(ph) * Math.sin(th) - 6;
    sct[i * 3 + 2] = R * Math.cos(ph);

    birth[i] = Math.random();

    let hue = 352 - c[1] * 1.15 + z * 2 + (Math.random() * 8 - 4);
    hue = clamp(hue, 320, 362);
    hueIdx[i] = Math.round((hue - 320) * 13 / 42);
    sizeRand[i] = Math.random();
    glitter[i] = (Math.abs(z) > 0.55 && Math.random() < 0.22) ? 1 : 0;
  }

  const SPRITE_N = 14;
  const sprites = [];
  for (let i = 0; i < SPRITE_N; i++) {
    const hue = 320 + (i + 0.5) * 42 / 14;
    const c = document.createElement('canvas');
    c.width = c.height = 64;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, 'rgba(255,255,255,1)');
    grad.addColorStop(0.18, 'hsla(' + hue + ',100%,74%,0.95)');
    grad.addColorStop(0.45, 'hsla(' + hue + ',100%,60%,0.35)');
    grad.addColorStop(1, 'hsla(' + hue + ',100%,52%,0)');
    g.fillStyle = grad;
    g.fillRect(0, 0, 64, 64);
    sprites.push(c);
  }

  const whiteSprite = (() => {
    const c = document.createElement('canvas');
    c.width = c.height = 64;
    const g = c.getContext('2d');
    const grad = g.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0, 'rgba(255,255,255,1)');
    grad.addColorStop(0.3, 'rgba(255,240,248,0.6)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    g.fillStyle = grad;
    g.fillRect(0, 0, 64, 64);
    return c;
  })();

  const SPARK_COLORS = ['255,185,215', '255,170,205', '218,178,255', '255,228,242'];
  const SPARKS = 110;
  const sparks = [];
  for (let i = 0; i < SPARKS; i++) {
    sparks.push({
      x: Math.random(), y: Math.random(),
      v: 0.00008 + Math.random() * 0.00028,
      r: 0.6 + Math.random() * 1.8,
      ph: Math.random() * Math.PI * 2,
      sp: 0.5 + Math.random() * 1.5,
      c: SPARK_COLORS[i % SPARK_COLORS.length]
    });
  }

  const rings = [];
  function spawnRing(big) { rings.push({ p: 0, big: big }); }

  const PERIOD = 1150;
  let lastP = 0;
  function beatScale(now) {
    const p = ((now - T0) % PERIOD) / PERIOD;
    const b1 = Math.exp(-Math.pow(p - 0.10, 2) / 0.00032);
    const b2 = 0.7 * Math.exp(-Math.pow(p - 0.24, 2) / 0.0007);
    if (lastP < 0.10 && p >= 0.10) spawnRing(true);
    if (lastP < 0.24 && p >= 0.24) spawnRing(false);
    lastP = p;
    return 1 + 0.055 * (b1 + b2);
  }

  let tx = 0.5, ty = 0.5;
  let userY = 0, userX = -0.42;
  let velY = 0, velX = 0;
  let dragging = false, freezeY = null;
  let lastPX = 0, lastPY = 0, lastT = 0;
  let dragSpeed = 0;

  window.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    dragging = true;
    velY = 0; velX = 0;
    dragSpeed = 0;
    lastPX = e.clientX; lastPY = e.clientY;
    lastT = performance.now();
  });
  window.addEventListener('pointermove', (e) => {
    tx = e.clientX / window.innerWidth;
    ty = e.clientY / window.innerHeight;
    if (!dragging) return;
    const now = performance.now();
    const dtm = Math.max(now - lastT, 1) / 1000;
    const dx = e.clientX - lastPX, dy = e.clientY - lastPY;
    userY += dx * 0.0055;
    userX = clamp(userX - dy * 0.0045, -1.0, 0.3);
    const instY = clamp(dx * 0.0055 / dtm, -8, 8);
    const instX = clamp(-dy * 0.0045 / dtm, -6, 6);
    velY = velY * 0.5 + instY * 0.5;
    velX = velX * 0.5 + instX * 0.5;
    dragSpeed = clamp(Math.hypot(instY, instX), 0, 10);
    lastPX = e.clientX; lastPY = e.clientY; lastT = now;
  });
  const endDrag = () => { dragging = false; };
  window.addEventListener('pointerup', endDrag);
  window.addEventListener('pointercancel', endDrag);
  window.addEventListener('blur', endDrag);

  const stars = [];
  let nextStar = T0 + 3000;

  let prev = performance.now();

  function frame(now) {
    const dt = Math.min((now - prev) / 1000, 0.1);
    prev = now;
    const tSec = (now - T0) / 1000;
    const introDone = tSec >= INTRO_END;

    const autoY = now * (0.00042 + 0.00033 * Math.exp(-tSec * 0.8));
    if (dragging && freezeY === null) freezeY = autoY;
    if (!dragging) {
      if (freezeY !== null) { userY += autoY - freezeY; freezeY = null; }
      userY += velY * dt;
      userX = clamp(userX + velX * dt, -1.0, 0.3);
      const decay = Math.exp(-dt * 3);
      velY *= decay; velX *= decay;
      if (Math.abs(velY) < 0.02) velY = 0;
      if (Math.abs(velX) < 0.02) velX = 0;
    } else {
      dragSpeed *= Math.exp(-dt * 4);
    }
    const spin = dragging ? dragSpeed : Math.abs(velY) + Math.abs(velX);
    const idle = !dragging && spin < 0.06;
    const rotY = autoY + userY - (freezeY === null ? 0 : freezeY) + (idle ? (tx - 0.5) * 0.16 : 0);
    const rotX = clamp(userX + (idle ? (ty - 0.5) * 0.12 : 0), -1.15, 0.55);

    ctx.globalCompositeOperation = 'source-over';
    const fade = 0.32 - Math.min(0.16, spin * 0.09);
    ctx.fillStyle = 'rgba(4,4,12,' + fade.toFixed(3) + ')';
    ctx.fillRect(0, 0, W, H);

    if (now > nextStar) {
      nextStar = now + 3500 + Math.random() * 4500;
      stars.push({
        x: Math.random() * W,
        y: Math.random() * H * 0.45,
        len: 60 + Math.random() * 90,
        ang: Math.PI * (0.75 + Math.random() * 0.15),
        v: 5 + Math.random() * 7,
        life: 0
      });
    }
    for (let i = stars.length - 1; i >= 0; i--) {
      const st = stars[i];
      st.life += dt;
      if (st.life > 1.2) { stars.splice(i, 1); continue; }
      const a = Math.sin(Math.PI * st.life / 1.2) * 0.5;
      const dxs = Math.cos(st.ang), dys = Math.sin(st.ang);
      const sx = st.x + dxs * st.v * st.life * 60;
      const sy = st.y + dys * st.v * st.life * 60;
      const grad = ctx.createLinearGradient(sx, sy, sx - dxs * st.len, sy - dys * st.len);
      grad.addColorStop(0, 'rgba(255,232,246,' + a.toFixed(3) + ')');
      grad.addColorStop(1, 'rgba(255,232,246,0)');
      ctx.strokeStyle = grad;
      ctx.lineWidth = DPR;
      ctx.beginPath();
      ctx.moveTo(sx, sy);
      ctx.lineTo(sx - dxs * st.len, sy - dys * st.len);
      ctx.stroke();
    }

    for (const s of sparks) {
      s.y -= s.v * dt * 60;
      s.x += Math.sin(now * 0.0003 * s.sp + s.ph) * 0.00002 * dt * 60;
      if (s.y < -0.02) { s.y = 1.02; s.x = Math.random(); }
      const a = 0.15 + 0.32 * (0.5 + 0.5 * Math.sin(now * 0.001 * s.sp + s.ph));
      ctx.fillStyle = 'rgba(' + s.c + ',' + a.toFixed(3) + ')';
      ctx.beginPath();
      ctx.arc(s.x * W, s.y * H, s.r * DPR, 0, 6.2832);
      ctx.fill();
    }

    const beat = beatScale(now);
    const S = Math.min(W, H) * 0.020 * beat;
    const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
    const cosX = Math.cos(rotX), sinX = Math.sin(rotX);
    const halfW = W / 2;
    const halfH = H * 0.50 + Math.sin(now * 0.0005) * H * 0.006;
    const hueShift = Math.round(Math.sin(now * 0.00006) * 3);

    ctx.globalCompositeOperation = 'lighter';
    for (let i = 0; i < POINTS; i++) {
      const sr = sizeRand[i];
      let e = 1;
      if (!introDone) {
        const ip = clamp((tSec - birth[i] * INTRO_SPREAD) / INTRO_DUR, 0, 1);
        e = 1 - Math.pow(1 - ip, 3);
      }
      const ie = 1 - e;
      const tw = 0.82 + 0.18 * Math.sin(now * 0.0022 * (1 + sr) + sr * 6.283);
      const br = 1 + 0.016 * Math.sin(now * 0.0035 + sr * 12.566);
      const x = (pts[i * 3] + sct[i * 3] * ie) * S * br;
      const y = (pts[i * 3 + 1] + sct[i * 3 + 1] * ie) * S * br;
      const z = (pts[i * 3 + 2] + sct[i * 3 + 2] * ie) * S * br;
      const x1 = x * cosY + z * sinY;
      const z1 = -x * sinY + z * cosY;
      const y1 = y * cosX - z1 * sinX;
      const z2 = y * sinX + z1 * cosX;
      const persp = FOV / (FOV + z2);
      const depth = clamp((z2 / S + ZN) / (ZN * 2), 0, 1);
      const px = halfW + x1 * persp;
      const py = halfH - y1 * persp;
      const r = Math.max(1.2, S * (0.075 + 0.085 * sr) * persp * (0.6 + 0.5 * depth));
      const a = (0.22 + 0.6 * depth) * tw * (0.55 + 0.45 * e);
      if (a > 0.02) {
        ctx.globalAlpha = a;
        const idx = clamp(hueIdx[i] + hueShift, 0, SPRITE_N - 1);
        ctx.drawImage(sprites[idx], px - r, py - r, r * 2, r * 2);
        if (glitter[i] && depth > 0.72 && e > 0.9) {
          ctx.globalAlpha = (depth - 0.72) * 3 * tw * e;
          const r2 = r * 0.55;
          ctx.drawImage(whiteSprite, px - r2, py - r2, r2 * 2, r2 * 2);
        }
      }
    }

    for (let i = rings.length - 1; i >= 0; i--) {
      const rg = rings[i];
      rg.p += dt * 1.4;
      if (rg.p >= 1) { rings.splice(i, 1); continue; }
      const rr = S * 13 + rg.p * S * 16;
      ctx.strokeStyle = 'rgba(255,90,140,' + ((1 - rg.p) * (rg.big ? 0.34 : 0.18)).toFixed(3) + ')';
      ctx.lineWidth = (rg.big ? 2.4 : 1.4) * DPR;
      ctx.beginPath();
      ctx.arc(halfW, halfH, rr, 0, 6.2832);
      ctx.stroke();
    }

    ctx.globalAlpha = 1;
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
